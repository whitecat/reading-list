<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reading List</title>
    <script
      type="module"
      src="./scripts/components/reading-list-app.js"
    ></script>
    <style>
      @font-face {
        font-family: 'Inter Variable';
        src: url('./files/inter-latin-wght-normal.woff2') format('woff2');
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
      }
      html,
      body {
        margin: 0;
        width: 360px;
        height: 520px;
        overflow: hidden;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #171717;
        }
      }
      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #fff;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #171717;
      }
      body {
        font-family:
          'Inter Variable',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
    </style>
  </head>
  <body class="popup-page">
    <reading-list-app></reading-list-app>
  </body>
</html>
